name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e services/api[dev] -e services/ai[dev]
      - run: python -m ruff check services/api services/ai
      - run: python -m ruff format --check services/api services/ai
      - run: python -m mypy services/api/app
      - run: python -m mypy services/ai/app
      - run: python -m pytest tests
        working-directory: services/api
      - run: python -m pytest tests
        working-directory: services/ai
