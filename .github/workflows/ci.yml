      - name: Validate ranking-only fixture without invented safety outcomes
        run: |
          python - <<'PY'
          from app.evaluation.runner import deterministic_synthetic_baseline

          baseline = deterministic_synthetic_baseline()
          safety_fields = (
              "provider_contamination_rate",
              "assessment_contamination_rate",
              "scope_compliance_rate",
              "citation_validity_rate",
              "historical_version_accuracy",
          )
          for summary in (baseline.before, baseline.after):
              assert summary.gate == "NOT_AVAILABLE"
              assert all(getattr(summary, field) is None for field in safety_fields)
          assert baseline.after.mrr > baseline.before.mrr
          assert baseline.after.ndcg_at_5 > baseline.before.ndcg_at_5
          print({
              "ranking_fixture_mrr_before": baseline.before.mrr,
              "ranking_fixture_mrr_after": baseline.after.mrr,
              "ranking_fixture_ndcg_before": baseline.before.ndcg_at_5,
              "ranking_fixture_ndcg_after": baseline.after.ndcg_at_5,
              "unmeasured_safety_gate": baseline.after.gate,
          })
          PY
        working-directory: services/api
      - run: python -m pytest tests
        working-directory: services/ai
      - name: Stop MinIO
        if: always()
        run: |
          set -euo pipefail
          MINIO_PID="$RUNNER_TEMP/minio.pid"
          if [ -f "$MINIO_PID" ]; then
            pid="$(cat "$MINIO_PID")"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" || true
              wait "$pid" 2>/dev/null || true
            fi
          fi
