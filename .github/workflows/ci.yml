name: CI

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prufai
          POSTGRES_PASSWORD: prufai_ci
          POSTGRES_DB: prufai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prufai -d prufai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e services/api[dev] -e services/ai[dev]
      - run: python -m ruff check services/api services/ai
      - run: python -m ruff format --check services/api services/ai
      - run: python -m mypy services/api/app
      - run: python -m mypy services/ai/app
      - run: python -m pytest tests
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_retrieval_quality.py
        working-directory: services/api
      - run: python -m pytest tests/test_standard_packs.py
        working-directory: services/api
      - run: python -m alembic upgrade head
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_question_bank_postgresql_integration.py
        working-directory: services/api
        env:
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_exam_studio.py tests/test_exam_studio_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_candidate_runtime.py tests/test_candidate_runtime_postgresql_integration.py tests/test_demo_seed_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_candidate_audio_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_speech_transcription_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_speaking_assessment_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_result_governance_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_result_correction_scenario_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_result_governance_concurrency_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_result_correction_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_result_release_postgresql_integration.py tests/test_result_release_concurrency_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_control_centre_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - name: Install pinned MinIO
        run: |
          set -euo pipefail
          go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
          MINIO_BIN="$(go env GOPATH)/bin/minio"
          test -x "$MINIO_BIN"
          echo "MinIO binary: $MINIO_BIN"
      - name: Start pinned MinIO
        env:
          MINIO_ROOT_USER: prufai_ci
          MINIO_ROOT_PASSWORD: prufai_ci_secret
        run: |
          set -euo pipefail
          MINIO_BIN="$(go env GOPATH)/bin/minio"
          MINIO_DATA_DIR="$RUNNER_TEMP/prufai-minio-data"
          MINIO_LOG="$RUNNER_TEMP/minio.log"
          MINIO_PID="$RUNNER_TEMP/minio.pid"
          mkdir -p "$MINIO_DATA_DIR"
          MINIO_ROOT_USER="$MINIO_ROOT_USER" MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            "$MINIO_BIN" server "$MINIO_DATA_DIR" \
            --address ":9000" --console-address ":9001" >"$MINIO_LOG" 2>&1 &
          echo $! > "$MINIO_PID"
          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "MinIO did not become ready."
            cat "$MINIO_LOG"
            exit 1
          fi
          if ! kill -0 "$(cat "$MINIO_PID")" 2>/dev/null; then
            echo "MinIO exited after becoming ready."
            cat "$MINIO_LOG"
            exit 1
          fi
      - run: >-
          python -c "import boto3;
          c=boto3.client('s3', endpoint_url='http://localhost:9000',
          aws_access_key_id='prufai_ci', aws_secret_access_key='prufai_ci_secret',
          region_name='us-east-1');
          c.create_bucket(Bucket='prufai-ci')"
        working-directory: services/api
      - run: python -m pytest tests/test_object_storage_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_OBJECT_STORAGE_INTEGRATION: "1"
          OBJECT_STORAGE_ENDPOINT: http://localhost:9000
          OBJECT_STORAGE_BUCKET: prufai-ci
          OBJECT_STORAGE_ACCESS_KEY: prufai_ci
          OBJECT_STORAGE_SECRET_KEY: prufai_ci_secret
          OBJECT_STORAGE_SECURE: "0"
      - run: python -m pytest tests/test_speech_transcription_object_storage_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_OBJECT_STORAGE_INTEGRATION: "1"
          OBJECT_STORAGE_ENDPOINT: http://localhost:9000
          OBJECT_STORAGE_BUCKET: prufai-ci
          OBJECT_STORAGE_ACCESS_KEY: prufai_ci
          OBJECT_STORAGE_SECRET_KEY: prufai_ci_secret
          OBJECT_STORAGE_SECURE: "0"
      - run: python -m pytest tests/test_speaking_assessment_object_storage_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_OBJECT_STORAGE_INTEGRATION: "1"
          OBJECT_STORAGE_ENDPOINT: http://localhost:9000
          OBJECT_STORAGE_BUCKET: prufai-ci
          OBJECT_STORAGE_ACCESS_KEY: prufai_ci
          OBJECT_STORAGE_SECRET_KEY: prufai_ci_secret
          OBJECT_STORAGE_SECURE: "0"
      - run: python -m pytest tests/test_scoring.py tests/test_scoring_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_writing_assessment.py tests/test_writing_assessment_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: >-
          python -c "import os, psycopg;
          c=psycopg.connect(os.environ['DATABASE_URL'].replace('postgresql+psycopg://','postgresql://'));
          print({'database': c.execute('SELECT current_database()').fetchone()[0],
          'schema': c.execute('SELECT current_schema()').fetchone()[0],
          'search_path': c.execute('SHOW search_path').fetchone()[0],
          'alembic_head': c.execute(\"SELECT version_num FROM alembic_version\").fetchall()})"
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_rules_engine.py tests/test_rules_postgresql_integration.py
        working-directory: services/api
        env:
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_ai_orchestration.py tests/test_ai_orchestration_postgresql_integration.py
        working-directory: services/api
        env:
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_memory_governance.py
        working-directory: services/api
      - run: python -m pytest tests/test_memory_postgresql_integration.py
        working-directory: services/api
        env:
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -c "import psycopg; c=psycopg.connect('postgresql://prufai:prufai_ci@localhost:5432/prufai'); print(c.execute(\"SELECT extname FROM pg_extension WHERE extname = 'vector'\").fetchone()); assert c.execute(\"SELECT extname FROM pg_extension WHERE extname = 'vector'\").fetchone() is not None"
        working-directory: services/api
      - run: python -m pytest tests/test_postgresql_integration.py
        working-directory: services/api
        env:
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_postgresql_retrieval_integration.py
        working-directory: services/api
        env:
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_redis_integration.py
        working-directory: services/api
        env:
          REDIS_INTEGRATION_URL: redis://localhost:6379/0
      - run: python -m pytest tests/test_memory_redis_integration.py
        working-directory: services/api
        env:
          REDIS_INTEGRATION_URL: redis://localhost:6379/0
      - run: >-
          python -c "from app.evaluation.runner import deterministic_synthetic_baseline;
          baseline=deterministic_synthetic_baseline();
          assert baseline.before.gate == 'PASS' and baseline.after.gate == 'PASS'"
        working-directory: services/api
      - run: python -m pytest tests
        working-directory: services/ai
      - name: Stop MinIO
        if: always()
        run: |
          set -euo pipefail
          MINIO_PID="$RUNNER_TEMP/minio.pid"
          if [ -f "$MINIO_PID" ]; then
            pid="$(cat "$MINIO_PID")"
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" || true
              wait "$pid" 2>/dev/null || true
            fi
          fi
