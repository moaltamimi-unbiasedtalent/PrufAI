name: CI

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit production npm dependencies
        run: npm audit --omit=dev
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: prufai
          POSTGRES_PASSWORD: prufai_ci
          POSTGRES_DB: prufai_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prufai -d prufai_browser"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install --upgrade "pip>=26.2,<27" "setuptools>=84.1,<85"
      - run: python -m pip install -e services/api[dev]
      - run: npm ci
        working-directory: apps/web
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.13"
          cache: false
      - name: Provision pinned audio decoder
        run: bash scripts/setup-media-runtime.sh
      - name: Install pinned MinIO
        run: |
          set -euo pipefail
          go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
          MINIO_BIN="$(go env GOPATH)/bin/minio"
          test -x "$MINIO_BIN"
          sha256sum "$MINIO_BIN"
          go version -m "$MINIO_BIN"
      - name: Start pinned MinIO
        env:
          MINIO_ROOT_USER: prufai_ci
          MINIO_ROOT_PASSWORD: prufai_ci_secret
        run: |
          set -euo pipefail
          MINIO_BIN="$(go env GOPATH)/bin/minio"
          MINIO_DATA_DIR="$RUNNER_TEMP/prufai-minio-data"
          MINIO_LOG="$RUNNER_TEMP/minio.log"
          MINIO_PID="$RUNNER_TEMP/minio.pid"
          mkdir -p "$MINIO_DATA_DIR"
          MINIO_ROOT_USER="$MINIO_ROOT_USER" MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            "$MINIO_BIN" server "$MINIO_DATA_DIR" \
            --address ":9000" --console-address ":9001" >"$MINIO_LOG" 2>&1 &
          echo $! > "$MINIO_PID"
          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "MinIO did not become ready."
            cat "$MINIO_LOG"
            exit 1
          fi
          if ! kill -0 "$(cat "$MINIO_PID")" 2>/dev/null; then
            echo "MinIO exited after becoming ready."
            cat "$MINIO_LOG"
            exit 1
          fi
      - run: >-
          python -c "import boto3;
          c=boto3.client('s3', endpoint_url='http://localhost:9000',
          aws_access_key_id='prufai_ci', aws_secret_access_key='prufai_ci_secret',
          region_name='us-east-1');
          c.create_bucket(Bucket='prufai-ci')"
        working-directory: services/api
      - name: Install isolated browser acceptance tooling
        run: |
          tool_dir="$RUNNER_TEMP/prufai-browser-tool"
          mkdir -p "$tool_dir"
          cp infra/browser-tool/package.json infra/browser-tool/package-lock.json "$tool_dir/"
          npm ci --prefix "$tool_dir" --ignore-scripts
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/prufai-playwright-binaries"
          node "$tool_dir/node_modules/@playwright/test/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          node - "$tool_dir/node_modules/playwright-core" <<'JS'
          const { createHash } = require('node:crypto');
          const { createReadStream } = require('node:fs');
          const { relative } = require('node:path');
          const { registry } = require(process.argv[2] + '/lib/server/registry/index.js');
          async function recordBinaries() {
            for (const name of ['chromium', 'chromium-headless-shell', 'ffmpeg']) {
              const path = registry.findExecutable(name).executablePath();
              const hash = createHash('sha256');
              for await (const data of createReadStream(path)) hash.update(data);
              console.log(hash.digest('hex'), relative(process.env.PLAYWRIGHT_BROWSERS_PATH, path));
            }
          }
          recordBinaries().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Real three-application browser acceptance
        env:
          DATABASE_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai_browser
          PRUFAI_DISPOSABLE_DATABASE: prufai_browser
          CI: "true"
          PRUFAI_BROWSER_TOOL_DIR: ${{ runner.temp }}/prufai-browser-tool
          PRUFAI_E2E_ARTIFACT_DIR: ${{ runner.temp }}/prufai-browser-evidence
          AUDIO_MEDIA_RUNTIME: docker
          AUDIO_MEDIA_IMAGE: prufai-media:ffmpeg-6.1.1
          OBJECT_STORAGE_BACKEND: s3
          OBJECT_STORAGE_ENDPOINT: http://localhost:9000
          OBJECT_STORAGE_BUCKET: prufai-ci
          OBJECT_STORAGE_ACCESS_KEY: prufai_ci
          OBJECT_STORAGE_SECRET_KEY: prufai_ci_secret
          OBJECT_STORAGE_SECURE: "0"
        run: bash scripts/run-integrated-browser.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: integrated-browser-evidence
          path: ${{ runner.temp }}/prufai-browser-evidence
          retention-days: 7
      - name: Stop browser MinIO
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/minio.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/minio.pid")" 2>/dev/null || true
          fi

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
        env:
          POSTGRES_USER: prufai
          POSTGRES_PASSWORD: prufai_ci
          POSTGRES_DB: prufai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prufai -d prufai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.13"
          cache: false
      - name: Isolate pytest temporary directories
        run: |
          private_pytest_root="$(mktemp -d "$RUNNER_TEMP/prufai-pytest.XXXXXX")"
          chmod 700 "$private_pytest_root"
          echo "PYTEST_DEBUG_TEMPROOT=$private_pytest_root" >> "$GITHUB_ENV"
      - run: python -m pip install --upgrade "pip>=26.2,<27" "setuptools>=84.1,<85"
      - run: python -m pip install -e services/api[dev] -e services/ai[dev]
      - name: Provision pinned audio decoder
        run: bash scripts/setup-media-runtime.sh
      - run: python -m ruff check services/api services/ai
      - run: python -m ruff format --check services/api services/ai
      - run: python -m mypy services/api/app
      - run: python -m mypy services/ai/app
      - name: Initial scoped review authority (required PostgreSQL)
        run: |
          python -m pytest tests/test_initial_review_authority_postgresql_integration.py -v --junitxml="$RUNNER_TEMP/initial-review-authority-required.xml"
          python ../../scripts/check-required-evaluation-junit.py "$RUNNER_TEMP/initial-review-authority-required.xml" test_initial_review_authority_postgresql_integration
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          PRUFAI_DISPOSABLE_DATABASE: prufai
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@127.0.0.1:5432/prufai
      - run: python -m pytest tests
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_retrieval_quality.py
        working-directory: services/api
      - run: python -m pytest tests/test_standard_packs.py
        working-directory: services/api
      - run: python -m alembic upgrade head
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_question_bank_postgresql_integration.py
        working-directory: services/api
        env:
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_exam_studio.py tests/test_exam_studio_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_candidate_runtime.py tests/test_candidate_runtime_postgresql_integration.py tests/test_demo_seed_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_candidate_audio_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_speech_transcription_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_speaking_assessment_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_result_governance_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_result_correction_scenario_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_result_governance_concurrency_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_result_correction_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_result_release_postgresql_integration.py tests/test_result_release_concurrency_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_control_centre_postgresql_integration.py
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - name: Governed evaluation foundation (required PostgreSQL)
        run: |
          python -m pytest tests/test_evaluation_foundation_postgresql_integration.py -v --junitxml="$RUNNER_TEMP/evaluation-foundation-required.xml"
          python -c "import os,xml.etree.ElementTree as E; suites=E.parse(os.environ['RUNNER_TEMP']+'/evaluation-foundation-required.xml').getroot().findall('.//testsuite'); tests=sum(int(s.get('tests','0')) for s in suites); skipped=sum(int(s.get('skipped','0')) for s in suites); print({'required_evaluation_foundation_tests':tests,'required_skips':skipped}); assert tests>0 and skipped==0, 'Required governed evaluation tests must execute without skips'"
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - name: Integrated three-application practice journey (required PostgreSQL)
        run: python -m pytest tests/test_integrated_practice_postgresql_integration.py -v
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - name: Human Writing foundation (required PostgreSQL)
        run: python -m pytest tests/test_writing_foundation_postgresql_integration.py -v
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - name: Integrated HUMAN Writing result journey (required PostgreSQL)
        run: python -m pytest tests/test_integrated_writing_postgresql_integration.py -v
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - name: Governed AI Writing proposal execution (required PostgreSQL)
        run: |
          python -m pytest tests/test_writing_execution_postgresql_integration.py -v --junitxml="$RUNNER_TEMP/writing-execution-required.xml"
          python -c "import os,xml.etree.ElementTree as E; suites=E.parse(os.environ['RUNNER_TEMP']+'/writing-execution-required.xml').getroot().findall('.//testsuite'); tests=sum(int(s.get('tests','0')) for s in suites); skipped=sum(int(s.get('skipped','0')) for s in suites); print({'required_writing_execution_tests':tests,'required_skips':skipped}); assert tests>0 and skipped==0, 'Required governed Writing execution tests must execute without skips'"
        working-directory: services/api
        env:
          CI: true
          PRUFAI_REQUIRE_POSTGRES_INTEGRATION: "1"
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
          WRITING_TEST_ADAPTER_ENABLED: "1"
      - name: Install pinned MinIO
        run: |
          set -euo pipefail
          go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
          MINIO_BIN="$(go env GOPATH)/bin/minio"
          test -x "$MINIO_BIN"
          sha256sum "$MINIO_BIN"
          go version -m "$MINIO_BIN"
      - name: Start pinned MinIO
        env:
          MINIO_ROOT_USER: prufai_ci
          MINIO_ROOT_PASSWORD: prufai_ci_secret
        run: |
          set -euo pipefail
          MINIO_BIN="$(go env GOPATH)/bin/minio"
          MINIO_DATA_DIR="$RUNNER_TEMP/prufai-minio-data"
          MINIO_LOG="$RUNNER_TEMP/minio.log"
          MINIO_PID="$RUNNER_TEMP/minio.pid"
          mkdir -p "$MINIO_DATA_DIR"
          MINIO_ROOT_USER="$MINIO_ROOT_USER" MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            "$MINIO_BIN" server "$MINIO_DATA_DIR" \
            --address ":9000" --console-address ":9001" >"$MINIO_LOG" 2>&1 &
          echo $! > "$MINIO_PID"
          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "MinIO did not become ready."
            cat "$MINIO_LOG"
            exit 1
          fi
          if ! kill -0 "$(cat "$MINIO_PID")" 2>/dev/null; then
            echo "MinIO exited after becoming ready."
            cat "$MINIO_LOG"
            exit 1
          fi
      - run: >-
          python -c "import boto3;
          c=boto3.client('s3', endpoint_url='http://localhost:9000',
          aws_access_key_id='prufai_ci', aws_secret_access_key='prufai_ci_secret',
          region_name='us-east-1');
          c.create_bucket(Bucket='prufai-ci')"
        working-directory: services/api
      - name: Recorded primary audio journey (required PostgreSQL and real MinIO)
        run: |
          python -m pytest tests/test_recorded_audio_postgresql_minio_integration.py tests/test_audio_full_inspection.py -v --junitxml="$RUNNER_TEMP/recorded-audio-required.xml"
          python -c "import os,xml.etree.ElementTree as E; suites=E.parse(os.environ['RUNNER_TEMP']+'/recorded-audio-required.xml').getroot().findall('.//testsuite'); tests=sum(int(s.get('tests','0')) for s in suites); skipped=sum(int(s.get('skipped','0')) for s in suites); print({'required_recorded_audio_tests':tests,'required_skips':skipped}); assert tests>0 and skipped==0, 'Required recorded-audio tests must execute without skips'"
