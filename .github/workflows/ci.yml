name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prufai
          POSTGRES_PASSWORD: prufai_ci
          POSTGRES_DB: prufai
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U prufai -d prufai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e services/api[dev] -e services/ai[dev]
      - run: python -m ruff check services/api services/ai
      - run: python -m ruff format --check services/api services/ai
      - run: python -m mypy services/api/app
      - run: python -m mypy services/ai/app
      - run: python -m pytest tests
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m alembic upgrade head
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_postgresql_integration.py
        working-directory: services/api
        env:
          POSTGRES_INTEGRATION_URL: postgresql+psycopg://prufai:prufai_ci@localhost:5432/prufai
      - run: python -m pytest tests/test_redis_integration.py
        working-directory: services/api
        env:
          REDIS_INTEGRATION_URL: redis://localhost:6379/0
      - run: python -m pytest tests
        working-directory: services/ai
