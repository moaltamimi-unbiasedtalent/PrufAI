name: Supply-chain evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-evidence:
    name: Language SBOMs and audits (informational findings)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Generate language evidence
        id: collect
        run: bash scripts/supply-chain-language.sh "$RUNNER_TEMP/o1a-language"
      - name: Summarize language evidence
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.collect.outcome }}
        run: python3 scripts/summarize-supply-chain.py language "$RUNNER_TEMP/o1a-language"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: o1a-language-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/o1a-language
          retention-days: 30
          if-no-files-found: error

  container-go-evidence:
    name: Container and MinIO binary scans (informational findings)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install verified scanner versions
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/o1a-tools"
          mkdir -p "$tool_dir" "$RUNNER_TEMP/o1a-containers"
          cd "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz \
            -o trivy_0.76.2_Linux-64bit.tar.gz
          printf '%s  %s\n' bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf \
            trivy_0.76.2_Linux-64bit.tar.gz | sha256sum --check
          tar -xzf trivy_0.76.2_Linux-64bit.tar.gz trivy
          GOTOOLCHAIN=local GOBIN="$tool_dir" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          sha256sum trivy_0.76.2_Linux-64bit.tar.gz trivy govulncheck > "$RUNNER_TEMP/o1a-containers/scanners.sha256"
          go version -m govulncheck > "$RUNNER_TEMP/o1a-containers/govulncheck-build.txt"
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Build and scan container images and MinIO binaries
        id: collect
        run: bash scripts/supply-chain-images.sh "$RUNNER_TEMP/o1a-containers"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify MinIO ingress containment and private S3 compatibility
        run: |
          python -m pip install --upgrade "pip>=26.2,<27" "setuptools>=84.1,<85"
          python -m pip install -e 'services/api[dev]'
          bash scripts/check-supply-chain-minio.sh "$RUNNER_TEMP/o1a-containers"
      - name: Rehearse guarded storage failures and reconcile a PostgreSQL and S3 restore
        run: python scripts/storage-readiness/check.py "$RUNNER_TEMP/o1a-containers"
      - name: Rehearse isolated service failures and assessment evidence recovery
        run: python scripts/storage-readiness/operations.py "$RUNNER_TEMP/o1a-containers"
      - name: Summarize image and binary evidence
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.collect.outcome }}
        run: python3 scripts/summarize-supply-chain.py container "$RUNNER_TEMP/o1a-containers"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: o1a-containers-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/o1a-containers
          retention-days: 30
          if-no-files-found: error
