[build-system]
requires = ["setuptools>=84.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "prufai-api"
version = "0.1.0"
description = "PrüfAI modular API baseline"
requires-python = ">=3.11"
dependencies = ["anyio>=4.14.2,<5", "starlette>=1.3.1,<2", "python-dotenv>=1.2.2,<2", "urllib3>=2.8,<3", "alembic>=1.13,<2", "argon2-cffi>=23.1,<26", "boto3>=1.35,<2", "fastapi>=0.115,<1", "pgvector>=0.3,<1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3", "pypdf>=5,<7", "PyJWT>=2.9,<3", "redis>=5,<7", "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.32,<1"]

[project.optional-dependencies]
dev = ["boto3-stubs[s3]>=1.35,<2", "httpx>=0.27,<1", "mypy>=1.13,<2", "pytest>=9.0.3,<9.1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP006", "UP035", "UP045"]

[tool.mypy]
python_version = "3.9"
strict = true
