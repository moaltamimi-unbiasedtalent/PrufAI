[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prufai-api"
version = "0.1.0"
description = "PrüfAI modular API baseline"
requires-python = ">=3.9"
dependencies = ["alembic>=1.13,<2", "fastapi>=0.115,<1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "uvicorn[standard]>=0.32,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "mypy>=1.13,<2", "pytest>=8.3,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
